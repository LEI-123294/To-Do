name: Build ToDoApp

# Dispara sempre que houver push na branch main
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Build com Maven
      - name: Build with Maven
        run: mvn clean package

      # 4️⃣ Copiar .jar para a raiz do repositório (opcional)
      - name: Copy JAR to root
        run: cp target/*.jar .

      # 5️⃣ Publicar artefacto do workflow
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: ToDoApp-jar
          path: target/*.jar
