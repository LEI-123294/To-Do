name: Build ToDoApp

on:
  push:
    branches:
      - main  # Workflow dispara quando houver push para a branch principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configurar Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Compilar e gerar .jar com Maven
      - name: Build with Maven
        run: mvn clean package

      # 4. Copiar .jar para a raiz (opcional)
      - name: Copy JAR to root
        run: cp target/*.jar .

      # 5. Publicar artefacto
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: ToDoApp-jar
          path: '*.jar'
