name: Build ToDoApp

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn clean package
      - run: cp target/*.jar .
      - uses: actions/upload-artifact@v3
        with:
          name: ToDoApp-jar
          path: 'target/*.jar'
